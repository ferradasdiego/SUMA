<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FFFFFF" />
    <title>SUMA — Sin conexión</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #ffffff;
        color: #1f2a24;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main { width: 100%; max-width: 360px; }
      h1 { margin: 0 0 24px; color: #2d7a4b; font-size: 42px; letter-spacing: -1px; }
      p { margin: 0 0 14px; font-size: 17px; line-height: 1.5; }
      .muted { color: #5c6b62; font-size: 15px; }
      button {
        width: 100%;
        min-height: 52px;
        margin-top: 16px;
        border: 0;
        border-radius: 999px;
        background: #2d7a4b;
        color: #ffffff;
        font: inherit;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>SUMA</h1>
      <p><strong>No se pudo cargar la app.</strong></p>
      <p>
        Abre SUMA una vez con conexión y espera unos segundos para que se guarde la copia sin
        conexión. Después podrás usarla con el modo avión.
      </p>
      <p class="muted">
        The app could not load. Open SUMA once while online and wait a few seconds so it can be
        cached for offline use.
      </p>
      <button type="button" onclick="location.reload()">Reintentar / Retry</button>
    </main>
  </body>
</html>
