name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_NO_TELEMETRY: 1

jobs:
  quality:
    name: Calidad, pruebas y bundle
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.0

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Formato
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: TypeScript
        run: pnpm typecheck

      - name: Pruebas
        run: pnpm exec jest --ci --runInBand

      - name: Auditoría de dependencias de producción
        run: pnpm audit --prod --audit-level high --ignore-unfixable

      - name: Expo Doctor
        run: pnpm exec expo-doctor

      - name: Empaquetado iOS y Android
        run: pnpm exec expo export --platform ios --platform android --output-dir dist
